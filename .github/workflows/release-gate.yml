# Release gate: the test suite plus scripts/release_gate.py over the fixed
# answer sets. No secrets, no model key, no model call: LLM_PROVIDER=disabled
# for every step, and the dependency set has no model SDK, HTTP client or
# torch (checked below, not assumed).
name: release-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt
            requirements-server.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt

      - name: No model SDK, HTTP client or torch installed
        run: |
          python - <<'EOF'
          import importlib.util, sys
          bad = [m for m in ("anthropic", "requests", "dotenv", "torch",
                             "sentence_transformers", "phoenix") if importlib.util.find_spec(m)]
          print("forbidden packages installed:", bad or "none")
          sys.exit(1 if bad else 0)
          EOF

      - name: Test suite
        run: python -m pytest -q -rs

      - name: Release gate
        run: python scripts/release_gate.py
